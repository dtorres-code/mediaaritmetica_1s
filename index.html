<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TuProfe20 | Media aritmética</title>

<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--navy:#101e4e;--blue:#1746cc;--yellow:#ffd43b;--teal:#00b6a0;--pink:#ec4899}*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;color:var(--navy);background:linear-gradient(125deg,#162b80,#7c2fd1 65%,#c42b75);min-height:100vh}.app{width:min(100%,1920px);margin:auto;padding:10px 16px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;color:white;padding:8px 12px}.top h1{font-size:clamp(22px,2.4vw,36px);margin:0}.top small{font-weight:900;color:#ffe76b;letter-spacing:2px}.score{font-size:18px;font-weight:900;background:#0a8b75;padding:10px 16px;border-radius:14px}.nav{display:flex;gap:8px;align-items:center;margin:7px 0 11px}.numbers{display:flex;flex:1;gap:7px}.num{flex:1;min-width:0;background:#dbeafe;color:#172554;border:2px solid #93c5fd;padding:9px 0;font-size:20px;font-weight:950;border-radius:12px}.num.active{background:var(--yellow);border-color:#f97316;color:#422006}.num.done{background:#6ee7b7}.workspace{background:#e9f1ff;border:3px solid #88a9ff;border-radius:19px;padding:13px 17px;box-shadow:0 14px 32px #09144755;min-height:calc(100vh - 145px)}.heading{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,#1e40af,#6d28d9);border-radius:14px;color:white;padding:9px 16px}.heading h2{margin:0;font-size:clamp(23px,2.3vw,34px)}.heading p{margin:3px 0;font-size:clamp(15px,1.35vw,20px);font-weight:700}.robot{font-size:39px}.progress{height:7px;background:#bfdbfe;margin:10px 0;border-radius:9px;overflow:hidden}.fill{height:100%;background:#f59e0b;transition:.3s}.prompt{font-size:clamp(17px,1.55vw,22px);font-weight:900;margin:8px 0 10px;color:#1e3a8a}.columns{display:grid;grid-template-columns:minmax(0,1.06fr) minmax(0,.94fr);gap:20px}.visual,.solution{min-width:0}.visual h3,.solution h3{font-size:clamp(20px,1.7vw,26px);color:#1d3eae;margin:0 0 8px;border-bottom:4px solid #fbbf24;padding-bottom:5px}.chartbox{height:clamp(235px,34vh,350px);position:relative;background:#f5f9ff;border:2px solid #9db8ef;border-radius:12px;padding:7px}.data{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}.datum{background:#dbeafe;border:2px solid #60a5fa;padding:5px 10px;font-size:clamp(24px,2.2vw,34px);font-weight:950;border-radius:9px}.labels{font-size:22px;font-weight:750;color:#344a7b;margin:7px 0}.steps{display:flex;flex-direction:column;gap:13px}.step{padding:3px 0 10px;border-bottom:2px solid #a5b4fc}.step:last-child{border-bottom:0}.step-label{font-size:clamp(21px,1.9vw,28px);font-weight:950;color:#1e40af;margin-bottom:6px}.equation{font-size:clamp(27px,2.6vw,42px);font-weight:900;color:#162e85;min-height:42px}.equation mjx-container{font-weight:900!important;max-width:100%;overflow-x:auto;overflow-y:hidden;margin:0!important}.pending{color:#63759c;font-size:20px;font-weight:800}.answer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;font-size:20px;font-weight:900}.answer input{width:135px;padding:9px;font-size:23px;font-weight:900;text-align:center;border:3px solid #2563eb;border-radius:10px;background:#fff}.feedback{font-size:19px;font-weight:900;color:#047857;min-height:24px;margin-top:7px}.hint{font-size:16px;font-weight:700;color:#475569}.controls{display:flex;gap:12px;justify-content:center;margin-top:13px;flex-wrap:wrap}button{cursor:pointer;border:0;border-bottom:4px solid #1d4ed8;border-radius:11px;background:#2563eb;color:white;padding:11px 17px;font-size:17px;font-weight:900}button:disabled{opacity:.4;cursor:not-allowed}.secondary{background:#6d28d9;border-color:#4c1d95}.warning{background:#f59e0b;border-color:#b45309;color:#422006}.success{background:#059669;border-color:#065f46}.duo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.person{background:#e0ebff;border:2px solid #84a9ed;border-radius:14px;padding:10px;min-width:0}.person:nth-child(2){background:#f5e7ff;border-color:#b99af5}.person h3{font-size:clamp(22px,2vw,29px);text-align:center;margin:0 0 5px;color:#1e40af}.person:nth-child(2) h3{color:#6b21a8}.person .chartbox{height:clamp(180px,29vh,285px)}.person .steps{margin-top:12px;gap:9px}.person .step{border-bottom:2px solid #a5b4fc;padding-bottom:8px}.person .step-label{font-size:clamp(20px,1.6vw,26px)}.person .equation{font-size:clamp(25px,2.15vw,36px)}.compare-result{font-size:clamp(20px,2vw,28px);font-weight:950;color:#065f46;text-align:center;margin:10px 0}.pie-details{margin-top:10px}.pie-details table{width:100%;border-collapse:collapse;font-size:clamp(20px,1.7vw,27px);font-weight:900}.pie-details th{background:#1e40af;color:white}.pie-details td,.pie-details th{border:2px solid #6388d8;padding:10px;text-align:center}.pie-details tr:nth-child(odd) td{background:#dbeafe}.pie-details tr:nth-child(even) td{background:#f5eaff}.pie-details p{font-size:17px;font-weight:800}.cover{position:fixed;inset:0;background:radial-gradient(circle at 30% 20%,#7c3aed,#172554 70%);display:grid;place-items:center;z-index:20;color:white;text-align:center;padding:20px}.cover-inner{max-width:950px}.cover h1{font-size:clamp(40px,6vw,74px);margin:10px}.cover p{font-size:clamp(20px,2.5vw,29px);font-weight:700}.cover button{background:#fbbf24;color:#172554;border-color:#b45309;font-size:24px;padding:16px 30px}.hidden{display:none!important}@media(max-width:850px){.columns,.duo{grid-template-columns:1fr}.app{padding:6px}.workspace{padding:9px}.top{flex-wrap:wrap}.nav{flex-wrap:wrap}.numbers{flex-basis:100%}.chartbox{height:260px}.person .chartbox{height:220px}}@media(min-width:1100px){.workspace{min-height:calc(100vh - 140px)}}
</style></head><body><div class="cover" id="cover"><div class="cover-inner"><div style="font-size:70px">🤖📊</div><strong>TUPROFE20 · MATHLAB</strong><h1>Media aritmética</h1><p>10 desafíos interactivos · Gráficos · Resolución paso a paso</p><button onclick="document.getElementById('cover').classList.add('hidden')">▶ COMENZAR</button></div></div><div class="app"><header class="top"><div><small>TUPROFE20 MATHLAB</small><h1>📊 Laboratorio de Media Aritmética</h1></div><div class="score" id="score">0 / 10</div></header><nav class="nav"><div class="numbers" id="numbers"></div><button class="secondary" onclick="document.getElementById('cover').classList.remove('hidden')">⌂</button></nav><main class="workspace"><div class="heading"><span class="robot">🤖</span><div><h2 id="title"></h2><p id="speech"></p></div></div><div class="progress"><div class="fill" id="progress"></div></div><p class="prompt" id="prompt"></p><div id="content"></div><div class="controls"><button class="secondary" onclick="previous()">← Paso anterior</button><button id="next" onclick="next()">Siguiente paso →</button><button class="warning" onclick="replay()">↻ Repetir</button></div></main></div>
<script>
const missions=[
{title:'Notas de matemática',context:'Compara los promedios de Manolito y Raulito.',labels:['Manolito 1','Manolito 2','Manolito 3','Manolito 4'],values:[12,17,14,13],unit:'puntos',extra:'Manolito: 12, 17, 14, 13. Raulito: 14, 16, 18, 16. ¿Quién obtuvo el mayor promedio?',compare:{name:'Raulito',values:[14,16,18,16]}},
{title:'Estatura de siete niños',context:'Calcula la estatura media de los siete niños.',labels:['1','2','3','4','5','6','7'],values:[140,120,125,135,130,115,110],unit:'cm',note:'Valores de estatura recreados para practicar el procedimiento; verifica los números de la fotografía original.'},
{title:'Asistencia durante la semana',context:'Calcula el promedio diario de asistentes.',labels:['Lun','Mar','Mié','Jue','Vie'],values:[43,40,39,36,37],unit:'niños'},
{title:'Temperaturas mínimas',context:'¿Cuál es la temperatura media semanal?',labels:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],values:[32,29,31,32,30,28,16],unit:'°C'},
{title:'Preferencia de periódicos',context:'Calcula la media de lectores por periódico y observa el gráfico circular.',labels:['Comercio','Perú 21','República','Ojo','Expreso'],values:[200,40,60,80,20],unit:'personas',pie:true},
{title:'Preferencia de frutas',context:'Calcula la media de personas por fruta.',labels:['Manzana','Mandarina','Melón','Naranja'],values:[400,200,150,250],unit:'personas',pie:true},
{title:'Cajas de manzanas',context:'Halla la media de cajas cosechadas por día.',labels:['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],values:[100,200,50,150,300,200,250],unit:'cajas'},
{title:'Niños ausentes',context:'Calcula el promedio diario de ausencias.',labels:['Lun','Mar','Mié','Jue','Vie'],values:[2,4,7,3,5],unit:'niños'},
{title:'Número de hijos',context:'Calcula la media de hijos por familia.',labels:['Coveñas','Díaz','Monzón','Figueroa','Cancino'],values:[5,4,3,2,3],unit:'hijos'},
{title:'Horas trabajadas',context:'Calcula la media de horas trabajadas.',labels:['Lun','Mar','Mié','Jue','Vie','Sáb'],values:[10,8,9,7,6,5],unit:'horas'}
];
let current=0,step=0,charts=[],completed=new Set();const $=id=>document.getElementById(id);const sum=a=>a.reduce((x,y)=>x+y,0);const fmt=n=>Number(n.toFixed(2)).toLocaleString('es-PE',{maximumFractionDigits:2});const colors=['#f43f5e','#2563eb','#eab308','#059669','#9333ea','#ea580c','#0891b2'];
function nav(){$('numbers').innerHTML=missions.map((m,i)=>`<button class="num ${current===i?'active':''} ${completed.has(i)?'done':''}" title="${m.title}" onclick="openMission(${i})">${i+1}</button>`).join('');$('score').textContent=`⭐ ${completed.size} / 10`}
function tex(str){return String.raw`\(`+str+String.raw`\)`}
function stages(vals){let n=vals.length,total=sum(vals);return [String.raw`\boldsymbol{\overline{x}=\frac{${vals.join('+')}}{${n}}}`,String.raw`\boldsymbol{\overline{x}=\frac{${fmt(total)}}{${n}}}`,String.raw`\boldsymbol{\overline{x}=${fmt(total/n)}}`]}
function stepHtml(vals){let eq=stages(vals);return `<div class="steps">${['Sumamos los datos','Dividimos entre la cantidad','Obtenemos la media'].map((label,i)=>`<div class="step"><div class="step-label">${i+1}. ${label}</div><div class="equation">${step>=i+1?tex(eq[i]):'<span class="pending">Por descubrir…</span>'}</div></div>`).join('')}</div>`}
function chart(canvas,values,labels,pie=false){const obj=new Chart(canvas,{type:pie?'pie':'bar',data:{labels,datasets:[{data:values,backgroundColor:values.map((_,i)=>colors[i%colors.length]),borderColor:'#172554',borderWidth:pie?2:1,borderRadius:pie?0:5}]},plugins:[{id:'valueLabels',afterDatasetsDraw(c){const ctx=c.ctx;ctx.save();ctx.textAlign='center';ctx.font='900 27px system-ui';c.getDatasetMeta(0).data.forEach((el,i)=>{if(pie){let p=el.getProps(['x','y','startAngle','endAngle','innerRadius','outerRadius'],true),ang=(p.startAngle+p.endAngle)/2,r=p.outerRadius*.65;ctx.fillStyle='#fff';ctx.strokeStyle='#152451';ctx.lineWidth=5;ctx.strokeText(String(values[i]),p.x+Math.cos(ang)*r,p.y+Math.sin(ang)*r);ctx.fillText(String(values[i]),p.x+Math.cos(ang)*r,p.y+Math.sin(ang)*r)}else{ctx.fillStyle='#172554';ctx.fillText(String(values[i]),el.x,el.y-8)}});ctx.restore()}}],options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:24,left:4,right:4,bottom:0}},plugins:{legend:{display:pie,position:'bottom',labels:{font:{size:21,weight:'bold'},color:'#172554'}},tooltip:{enabled:true}},scales:pie?{}:{y:{beginAtZero:true,grid:{color:'#bfdbfe'},ticks:{font:{size:21,weight:'bold'},color:'#172554'}},x:{ticks:{font:{size:21,weight:'bold'},color:'#172554',maxRotation:0}}}}});charts.push(obj)}
function pieDetails(m){let total=sum(m.values);return `<div class="pie-details"><table><thead><tr><th>Sector</th><th>Valor</th><th>Porcentaje</th><th>Ángulo</th></tr></thead><tbody>${m.values.map((v,i)=>`<tr><td>${m.labels[i]}</td><td>${v}</td><td>${fmt(v/total*100)} %</td><td>${fmt(v/total*360)}°</td></tr>`).join('')}</tbody></table><p>Porcentaje = (valor ÷ ${total}) × 100 &nbsp; | &nbsp; Ángulo = (valor ÷ ${total}) × 360°</p></div>`}
function render(){charts.forEach(c=>c.destroy());charts=[];let m=missions[current];nav();$('title').textContent=`Ejercicio ${current+1} · ${m.title}`;$('speech').textContent=m.context;$('progress').style.width=`${step/5*100}%`;$('prompt').textContent=['Observa los datos y los gráficos.','PASO 1 · Identificamos y sumamos los datos.','PASO 2 · Calculamos la suma total.','PASO 3 · Hallamos la media aritmética.','Escribe la respuesta y comprueba.','¡Resolución completada!'][step];$('next').disabled=step===4;$('next').textContent=step===5?'Siguiente ejercicio →':'Siguiente paso →';if(current===0){let people=[{name:'Manolito',values:m.values},{name:'Raulito',values:m.compare.values}];$('content').innerHTML=`<div class="duo">${people.map((p,i)=>`<section class="person"><h3>${p.name}</h3><div class="data">${p.values.map(v=>`<span class="datum">${v}</span>`).join('')}</div><div class="chartbox"><canvas id="chart${i}"></canvas></div>${stepHtml(p.values)}</section>`).join('')}</div>${step===5?'<p class="compare-result">Raulito obtuvo el mayor promedio: 16 > 14</p>':''}<div class="answer ${step!==4?'hidden':''}"><label>Manolito <input id="response" inputmode="decimal" placeholder="Media"></label><label>Raulito <input id="response2" inputmode="decimal" placeholder="Media"></label><button class="success" onclick="check()">Comprobar ambos</button></div><div class="feedback" id="feedback"></div>`;people.forEach((p,i)=>chart($('chart'+i),p.values,['Nota 1','Nota 2','Nota 3','Nota 4']))}else{$('content').innerHTML=`<div class="columns"><section class="visual"><h3>📊 Datos y representación</h3><div class="data">${m.values.map(v=>`<span class="datum">${v}</span>`).join('')}</div><div class="chartbox"><canvas id="chart0"></canvas></div>${m.pie?pieDetails(m):`<p class="labels">${m.labels.map((l,i)=>`${l}: ${m.values[i]}`).join(' · ')}</p>`}</section><section class="solution"><h3>✏️ Resolución paso a paso</h3>${stepHtml(m.values)}<div class="answer ${step!==4?'hidden':''}"><label>Media <input id="response" inputmode="decimal" placeholder="Resultado"></label><button class="success" onclick="check()">Comprobar</button></div><div class="feedback" id="feedback"></div>${m.note?`<p class="hint">${m.note}</p>`:''}</section></div>`;chart($('chart0'),m.values,m.labels,!!m.pie)}if(step===5){completed.add(current);nav();$('next').disabled=false}if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([$('content')]);MathJax.typesetPromise([$('content')]).catch(console.error)}}
function openMission(i){current=i;step=0;render()}function next(){if(step===5){openMission((current+1)%10)}else if(step<4){step++;render()}}function previous(){step=Math.max(0,step-1);render()}function replay(){step=0;render()}function check(){const m=missions[current],a=$('response')?.value.trim().replace(',','.');let ok=a!==''&&Number.isFinite(Number(a))&&Math.abs(Number(a)-sum(m.values)/m.values.length)<.011;if(current===0){let b=$('response2')?.value.trim().replace(',','.');ok=ok&&b!==''&&Number.isFinite(Number(b))&&Math.abs(Number(b)-16)<.011}if(ok){step=5;render();$('feedback').textContent='✓ ¡Correcto!'}else{$('feedback').textContent='Revisa la suma y divide entre la cantidad de datos.';$('feedback').style.color='#be123c'}}document.addEventListener('keydown',e=>{if(e.key==='Enter'&&step===4&&e.target.tagName==='INPUT')check()});render();
</script><script>window.addEventListener('load',()=>{if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise([document.getElementById('content')]).catch(console.error)})</script></body></html>
